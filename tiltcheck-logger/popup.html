<!doctype html><meta charset="utf-8"><style>
body{font:14px system-ui;background:#0b0b0f;color:#eee;width:280px;margin:0;padding:14px}
h1{font-size:15px;margin:0 0 8px}.big{font-size:28px;font-weight:700;color:#7CFF6B}
.row{display:flex;justify-content:space-between;margin:4px 0;color:#bbb}
button{width:100%;margin-top:10px;padding:8px;border:0;border-radius:8px;background:#7CFF6B;font-weight:700;cursor:pointer}
small{color:#777}</style>
<h1>TiltCheck Logger</h1>
<div>Played today</div><div class="big" id="today">0m</div>
<div class="row"><span>Current session</span><b id="cur">none</b></div>
<div class="row"><span>Sessions today</span><b id="n">0</b></div>
<div class="row"><span>Longest no-break run</span><b id="streak">0m</b></div>
<div id="sites"></div>
<button id="csv">Export sessions CSV</button><button id="ev">Export events CSV</button>
<small>Stays on this computer. Nothing is uploaded.</small>
<script src="popup.js"></script>
